<div class="glossary-wrapper">

    <h1>APES Master Vocabulary Glossary</h1>
    <p>Search for any term or keyword from the entire course.</p>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" onkeyup="filterGlossary()" placeholder="🔍 Type a term or keyword (e.g., 'cancer', 'water', 'CFC')...">
    <div id="resultCount" class="result-count"></div>
  </div>

  <div class="glossary-list" id="glossaryList">
    </div>
</div>
