// Sort the glossary alphabetically by term
masterGlossary.sort((a, b) => a.t.localeCompare(b.t));

const listContainer = document.getElementById('glossaryList');
const countContainer = document.getElementById('resultCount');

// Function to render the terms to the screen
function renderGlossary(terms) {
  listContainer.innerHTML = ''; // Clear current list
  
  if (terms.length === 0) {
    listContainer.innerHTML = '<div class="no-results">No terms or definitions matched your search. Try another keyword!</div>';
    countContainer.innerText = "0 results found";
    return;
  }

  countContainer.innerText = `Showing ${terms.length} term(s)`;

  terms.forEach(item => {
    const card = document.createElement('div');
    card.className = 'term-card';
    
    const title = document.createElement('h3');
    title.className = 'term-title';
    title.innerText = item.t;
    
    const def = document.createElement('p');
    def.className = 'term-def';
    def.innerText = item.d;
    
    card.appendChild(title);
    card.appendChild(def);
    listContainer.appendChild(card);
  });
}

// Function to filter terms based on search input
function filterGlossary() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  
  const filteredTerms = masterGlossary.filter(item => {
    // Search checks BOTH the term name and the definition text!
    return item.t.toLowerCase().includes(query) || item.d.toLowerCase().includes(query);
  });
  
  renderGlossary(filteredTerms);
}

// Initial render of all terms on page load
window.onload = () => {
  renderGlossary(masterGlossary);
};
