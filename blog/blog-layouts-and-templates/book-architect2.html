<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Architect — Manuscript Organizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #0a0a0f;
    --bg-elevated: #111118;
    --bg-card: #16161f;
    --border: #222233;
    --border-hover: #2a2a40;
    --text-primary: #e8e8f0;
    --text-secondary: #8a8aa0;
    --text-muted: #555566;
    --accent: #fe0942;
    --accent-dim: #fe094240;
    --accent-glow: #fe094220;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
    --sidebar-width: 320px;
    --radius: 8px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-title::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
  }

  .book-meta {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .book-meta strong {
    color: var(--text-secondary);
  }

  .search-box {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .search-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-box input::placeholder {
    color: var(--text-muted);
  }

  .toc-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .toc-container::-webkit-scrollbar { width: 4px; }
  .toc-container::-webkit-scrollbar-track { background: transparent; }
  .toc-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .chapter {
    margin: 2px 8px;
    border-radius: var(--radius);
    overflow: hidden;
  }

  .chapter-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: var(--transition);
    user-select: none;
    position: relative;
  }

  .chapter-header:hover {
    background: var(--bg-card);
  }

  .chapter-header.active {
    background: var(--accent-dim);
    border-left: 2px solid var(--accent);
  }

  .chapter-header.active .ch-number,
  .chapter-header.active .ch-title {
    color: var(--accent);
  }

  .ch-toggle {
    width: 16px; height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 10px;
    transition: var(--transition);
    flex-shrink: 0;
  }

  .ch-toggle.expanded { transform: rotate(90deg); color: var(--accent); }

  .ch-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-width: 28px;
    flex-shrink: 0;
  }

  .ch-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ch-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: 4px;
  }

  .status-draft { background: var(--warning); }
  .status-review { background: var(--info); }
  .status-final { background: var(--success); }
  .status-empty { background: var(--text-muted); }

  .ch-wordcount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    flex-shrink: 0;
    margin-left: 4px;
  }

  .subchapters {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding-left: 24px;
  }

  .subchapters.open { max-height: 600px; }

  .subchapter {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px 8px 16px;
    cursor: pointer;
    border-radius: var(--radius);
    transition: var(--transition);
    margin: 1px 8px 1px 0;
    position: relative;
  }

  .subchapter::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 8px; height: 1px;
    background: var(--border);
  }

  .subchapter:hover {
    background: var(--bg-card);
  }

  .subchapter.active {
    background: var(--accent-dim);
    border-left: 2px solid var(--accent);
  }

  .subchapter.active .sub-title { color: var(--accent); }

  .sub-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    min-width: 24px;
    flex-shrink: 0;
  }

  .sub-title {
    font-size: 12px;
    color: var(--text-secondary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }

  .btn {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    border-radius: var(--radius);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: #ff1a52;
    box-shadow: 0 0 12px var(--accent-dim);
  }

  /* ─── MAIN CONTENT ─── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    height: 56px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
  }

  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .breadcrumbs .crumb {
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }

  .breadcrumbs .crumb:hover { color: var(--accent); }

  .breadcrumbs .sep {
    color: var(--text-muted);
    font-size: 10px;
  }

  .topbar-actions {
    display: flex;
    gap: 8px;
  }

  .topbar-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
  }

  .topbar-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .editor-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .editor-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-header {
    padding: 16px 32px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .editor-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
  }

  .editor-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .editor-meta {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .meta-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .meta-tag .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .editor-body {
    flex: 1;
    padding: 16px 32px 32px;
    overflow-y: auto;
  }

  .editor-body::-webkit-scrollbar { width: 6px; }
  .editor-body::-webkit-scrollbar-track { background: transparent; }
  .editor-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .content-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    transition: var(--transition);
  }

  .content-block:hover {
    border-color: var(--border-hover);
  }

  .content-block h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .content-block p {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary);
  }

  .content-block textarea {
    width: 100%;
    min-height: 200px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.7;
    resize: vertical;
    outline: none;
  }

  .content-block textarea::placeholder {
    color: var(--text-muted);
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .note-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    transition: var(--transition);
  }

  .note-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .note-card .note-tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 6px;
  }

  .note-card p {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .note-card .note-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Right panel for stats/outline */
  .right-panel {
    width: 280px;
    min-width: 280px;
    background: var(--bg-elevated);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .right-panel::-webkit-scrollbar { width: 4px; }
  .right-panel::-webkit-scrollbar-track { background: transparent; }
  .right-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .panel-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-section h4 {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .stat-row:last-child { border-bottom: none; }

  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-primary);
    font-weight: 500;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .outline-list {
    list-style: none;
  }

  .outline-list li {
    padding: 6px 0;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .outline-list li:hover {
    color: var(--accent);
  }

  .outline-list li::before {
    content: '';
    width: 4px; height: 4px;
    background: var(--text-muted);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .outline-list li:hover::before {
    background: var(--accent);
  }

  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 4px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition);
  }

  .tag:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 480px;
    max-width: 90vw;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .modal h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .modal .form-group {
    margin-bottom: 16px;
  }

  .modal label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .modal input, .modal select, .modal textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: var(--transition);
  }

  .modal input:focus, .modal select:focus, .modal textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .modal textarea { min-height: 80px; resize: vertical; }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 20px;
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    text-align: center;
    padding: 40px;
  }

  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.3;
  }

  .empty-state h2 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    max-width: 400px;
    line-height: 1.6;
  }

  /* Status badge in editor */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge-draft { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
  .badge-review { background: rgba(59,130,246,0.15); color: var(--info); border: 1px solid rgba(59,130,246,0.3); }
  .badge-final { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }

  /* Word count display */
  .word-count-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    padding: 4px 8px;
    background: var(--bg);
    border-radius: 4px;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in { animation: fadeIn 0.3s ease forwards; }

  .editor-title:hover {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-color: var(--accent-dim);
    text-underline-offset: 4px;
  }

  .editor-title:hover::after {
    content: ' ✎';
    font-size: 14px;
    color: var(--accent);
    opacity: 0.7;
  }

  /* Responsive */
  @media (max-width: 1200px) {
    .right-panel { display: none; }
  }

  @media (max-width: 768px) {
    .sidebar { position: fixed; left: -100%; top: 0; height: 100vh; z-index: 100; transition: left 0.3s ease; }
    .sidebar.open { left: 0; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">Book Architect</div>
    <div class="book-meta">
      <strong>Untitled Manuscript</strong><br>
      <span id="total-chapters">0 chapters</span> · <span id="total-words">0 words</span><br>
      <span id="last-edited">Last edited: Never</span>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search chapters, notes..." autocomplete="off">
  </div>

  <div class="toc-container" id="tocContainer">
    <!-- Chapters injected here -->
  </div>

  <div class="sidebar-footer">
    <button class="btn" onclick="openModal('chapter')">+ Chapter</button>
    <button class="btn btn-primary" onclick="openModal('subchapter')">+ Section</button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main">
  <div class="topbar">
    <div class="breadcrumbs" id="breadcrumbs">
      <span class="crumb" onclick="showDashboard()">Manuscript</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="exportData()">Export JSON</button>
      <button class="topbar-btn" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <div class="editor-area" id="editorArea">
    <!-- Content injected here -->
  </div>
</main>

<!-- RIGHT PANEL -->
<aside class="right-panel" id="rightPanel">
  <div class="panel-section">
    <h4>Manuscript Stats</h4>
    <div class="stat-row">
      <span class="stat-label">Total Words</span>
      <span class="stat-value" id="statTotalWords">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Chapters</span>
      <span class="stat-value" id="statChapters">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Sections</span>
      <span class="stat-value" id="statSections">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Completion</span>
      <span class="stat-value" id="statCompletion">0%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <div class="panel-section">
    <h4>Quick Outline</h4>
    <ul class="outline-list" id="outlineList">
      <!-- Outline injected here -->
    </ul>
  </div>

  <div class="panel-section">
    <h4>Tags</h4>
    <div class="tag-cloud" id="tagCloud">
      <span class="tag">character-arc</span>
      <span class="tag">plot-twist</span>
      <span class="tag">research-needed</span>
      <span class="tag">dialogue-heavy</span>
      <span class="tag">action-scene</span>
    </div>
  </div>
</aside>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <h3 id="modalTitle">Add New</h3>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="modalTitleInput" placeholder="Enter title...">
    </div>
    <div class="form-group" id="parentSelectGroup">
      <label>Parent Chapter</label>
      <select id="modalParentSelect"></select>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="modalStatus">
        <option value="draft">Draft</option>
        <option value="review">In Review</option>
        <option value="final">Final</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea id="modalNotes" placeholder="Quick notes about this section..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── DATA STRUCTURE ───
let bookData = {
  title: "Untitled Manuscript",
  chapters: [
    {
      id: "ch-1",
      number: 1,
      title: "Prologue: The Beginning",
      status: "final",
      wordCount: 2450,
      content: "The rain fell in sheets against the window, each droplet a tiny hammer striking glass...",
      notes: [
        { tag: "tone", text: "Keep it atmospheric and slow-burn", date: "2026-07-01" },
        { tag: "character", text: "Introduce the protagonist's internal conflict subtly", date: "2026-07-01" }
      ],
      subchapters: [
        { id: "sub-1-1", number: "1.1", title: "The Storm", status: "final", wordCount: 820, content: "Lightning cracked across the sky..." },
        { id: "sub-1-2", number: "1.2", title: "The Arrival", status: "review", wordCount: 1630, content: "The figure emerged from the fog..." }
      ]
    },
    {
      id: "ch-2",
      number: 2,
      title: "Rising Tension",
      status: "draft",
      wordCount: 0,
      content: "",
      notes: [
        { tag: "plot", text: "Need to establish the antagonist's motivation here", date: "2026-07-02" }
      ],
      subchapters: [
        { id: "sub-2-1", number: "2.1", title: "The Meeting", status: "draft", wordCount: 0, content: "" },
        { id: "sub-2-2", number: "2.2", title: "First Blood", status: "draft", wordCount: 0, content: "" },
        { id: "sub-2-3", number: "2.3", title: "The Aftermath", status: "empty", wordCount: 0, content: "" }
      ]
    },
    {
      id: "ch-3",
      number: 3,
      title: "The Turning Point",
      status: "empty",
      wordCount: 0,
      content: "",
      notes: [],
      subchapters: []
    }
  ]
};

let currentChapterId = null;
let currentSubchapterId = null;
let modalType = '';

// ─── INIT ───
document.addEventListener('DOMContentLoaded', () => {
  renderTOC();
  updateStats();
  showDashboard();

  document.getElementById('searchInput').addEventListener('input', (e) => {
    filterTOC(e.target.value);
  });
});

// ─── RENDER SIDEBAR TOC ───
function renderTOC() {
  const container = document.getElementById('tocContainer');
  container.innerHTML = '';

  bookData.chapters.forEach(ch => {
    const chapterEl = document.createElement('div');
    chapterEl.className = 'chapter';
    chapterEl.dataset.id = ch.id;

    const hasSubs = ch.subchapters && ch.subchapters.length > 0;
    const isActive = ch.id === currentChapterId && !currentSubchapterId;

    chapterEl.innerHTML = `
      <div class="chapter-header ${isActive ? 'active' : ''}" onclick="selectChapter('${ch.id}')">
        <span class="ch-toggle ${hasSubs ? '' : 'hidden'}" onclick="event.stopPropagation(); toggleSubchapters('${ch.id}')">▶</span>
        <span class="ch-number">Ch.${ch.number}</span>
        <span class="ch-title">${escapeHtml(ch.title)}</span>
        <span class="ch-status status-${ch.status}"></span>
        <span class="ch-wordcount">${ch.wordCount > 0 ? ch.wordCount.toLocaleString() : ''}</span>
      </div>
      <div class="subchapters" id="subs-${ch.id}">
        ${ch.subchapters.map(sub => `
          <div class="subchapter ${sub.id === currentSubchapterId ? 'active' : ''}" 
               onclick="selectSubchapter('${ch.id}', '${sub.id}')">
            <span class="sub-number">${sub.number}</span>
            <span class="sub-title">${escapeHtml(sub.title)}</span>
            <span class="ch-status status-${sub.status}"></span>
          </div>
        `).join('')}
      </div>
    `;

    container.appendChild(chapterEl);
  });

  updateBookMeta();
}

function toggleSubchapters(chId) {
  const subs = document.getElementById(`subs-${chId}`);
  const toggle = subs.previousElementSibling.querySelector('.ch-toggle');
  subs.classList.toggle('open');
  toggle.classList.toggle('expanded');
}

function selectChapter(chId) {
  currentChapterId = chId;
  currentSubchapterId = null;
  renderTOC();
  renderEditor();
  updateBreadcrumbs();
}

function selectSubchapter(chId, subId) {
  currentChapterId = chId;
  currentSubchapterId = subId;
  renderTOC();
  renderEditor();
  updateBreadcrumbs();
}

// ─── RENDER EDITOR ───
function renderEditor() {
  const area = document.getElementById('editorArea');

  if (!currentChapterId) {
    showDashboard();
    return;
  }

  const ch = bookData.chapters.find(c => c.id === currentChapterId);
  if (!ch) return;

  let target = ch;
  let isSub = false;

  if (currentSubchapterId) {
    target = ch.subchapters.find(s => s.id === currentSubchapterId);
    isSub = true;
  }

  const statusBadge = `
    <span class="status-badge badge-${target.status}">
      <span class="dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;"></span>
      ${target.status}
    </span>
  `;

  area.innerHTML = `
    <div class="editor-pane fade-in">
      <div class="editor-header">
        <div style="flex:1;min-width:0;">
          <div class="editor-title" id="editableTitle" style="cursor:text;" onclick="editTitle()" title="Click to edit title">${escapeHtml(target.title)}</div>
          <div class="editor-subtitle">${isSub ? `Chapter ${ch.number} · Section ${target.number}` : `Chapter ${ch.number}`}</div>
        </div>
        <div class="editor-meta">
          ${statusBadge}
          <span class="word-count-display">${target.wordCount.toLocaleString()} words</span>
        </div>
      </div>

      <div class="editor-body">
        <div class="content-block">
          <h3>Content</h3>
          <textarea id="contentEditor" placeholder="Start writing...">${escapeHtml(target.content || '')}</textarea>
        </div>

        <div class="content-block">
          <h3>Notes & Research</h3>
          <div class="notes-grid" id="notesGrid">
            ${(target.notes || []).length > 0 ? target.notes.map(note => `
              <div class="note-card">
                <div class="note-tag">${note.tag}</div>
                <p>${escapeHtml(note.text)}</p>
                <div class="note-date">${note.date}</div>
              </div>
            `).join('') : '<p style="color:var(--text-muted);font-size:13px;">No notes yet. Click + Section in the sidebar to add sections with notes.</p>'}
          </div>
        </div>
      </div>
    </div>

    <div class="right-panel" style="display:flex;">
      <div class="panel-section">
        <h4>Section Info</h4>
        <div class="stat-row">
          <span class="stat-label">Word Count</span>
          <span class="stat-value">${target.wordCount.toLocaleString()}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Status</span>
          <span class="stat-value" style="text-transform:capitalize;color:var(--${target.status === 'draft' ? 'warning' : target.status === 'review' ? 'info' : target.status === 'final' ? 'success' : 'text-muted'})">${target.status}</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">Characters</span>
          <span class="stat-value">${(target.content || '').length.toLocaleString()}</span>
        </div>
      </div>

      <div class="panel-section">
        <h4>Quick Actions</h4>
        <button class="btn" style="width:100%;margin-bottom:8px;" onclick="updateStatus('${isSub ? 'sub' : 'ch'}', '${target.id}', 'draft')">Mark as Draft</button>
        <button class="btn" style="width:100%;margin-bottom:8px;" onclick="updateStatus('${isSub ? 'sub' : 'ch'}', '${target.id}', 'review')">Mark as Review</button>
        <button class="btn" style="width:100%;margin-bottom:8px;" onclick="updateStatus('${isSub ? 'sub' : 'ch'}', '${target.id}', 'final')">Mark as Final</button>
        <button class="btn" style="width:100%;border-color:var(--danger);color:var(--danger);" onclick="deleteItem('${isSub ? 'sub' : 'ch'}', '${target.id}')">Delete</button>
      </div>
    </div>
  `;

  // Auto-save on input
  const textarea = document.getElementById('contentEditor');
  if (textarea) {
    textarea.addEventListener('input', (e) => {
      target.content = e.target.value;
      target.wordCount = e.target.value.trim().split(/\s+/).filter(w => w.length > 0).length;
      updateStats();
      updateBookMeta();
      // Update word count display in header
      const wcDisplay = document.querySelector('.word-count-display');
      if (wcDisplay) wcDisplay.textContent = target.wordCount.toLocaleString() + ' words';
    });
  }
}

function showDashboard() {
  currentChapterId = null;
  currentSubchapterId = null;
  renderTOC();
  updateBreadcrumbs();

  const area = document.getElementById('editorArea');
  const totalWords = bookData.chapters.reduce((sum, ch) => sum + ch.wordCount + ch.subchapters.reduce((s, sub) => s + sub.wordCount, 0), 0);
  const totalCh = bookData.chapters.length;
  const totalSubs = bookData.chapters.reduce((sum, ch) => sum + ch.subchapters.length, 0);
  const finalCount = bookData.chapters.filter(ch => ch.status === 'final').length + bookData.chapters.reduce((sum, ch) => sum + ch.subchapters.filter(s => s.status === 'final').length, 0);
  const totalItems = totalCh + totalSubs;
  const completion = totalItems > 0 ? Math.round((finalCount / totalItems) * 100) : 0;

  area.innerHTML = `
    <div class="editor-pane fade-in">
      <div class="editor-header">
        <div>
          <div class="editor-title">${escapeHtml(bookData.title)}</div>
          <div class="editor-subtitle">Manuscript Dashboard</div>
        </div>
      </div>

      <div class="editor-body">
        <div class="content-block">
          <h3>Overview</h3>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:16px;">
            <div style="text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);">
              <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--accent);">${totalWords.toLocaleString()}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Total Words</div>
            </div>
            <div style="text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);">
              <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--info);">${totalCh}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Chapters</div>
            </div>
            <div style="text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);">
              <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--success);">${totalSubs}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Sections</div>
            </div>
            <div style="text-align:center;padding:20px;background:var(--bg);border-radius:var(--radius);border:1px solid var(--border);">
              <div style="font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--warning);">${completion}%</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Completion</div>
            </div>
          </div>
        </div>

        <div class="content-block">
          <h3>Chapter Progress</h3>
          <div style="margin-top:16px;">
            ${bookData.chapters.map(ch => {
              const chTotalWords = ch.wordCount + ch.subchapters.reduce((s, sub) => s + sub.wordCount, 0);
              const subFinal = ch.subchapters.filter(s => s.status === 'final').length;
              const subTotal = ch.subchapters.length;
              const chDone = ch.status === 'final' && subFinal === subTotal;
              return `
                <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="selectChapter('${ch.id}')">
                  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);min-width:40px;">Ch.${ch.number}</span>
                  <span style="flex:1;font-size:13px;color:var(--text-primary);">${escapeHtml(ch.title)}</span>
                  <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);">${chTotalWords.toLocaleString()} words</span>
                  <span class="status-badge badge-${ch.status}" style="font-size:10px;">${ch.status}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="content-block">
          <h3>Recent Notes</h3>
          <div class="notes-grid" style="margin-top:16px;">
            ${bookData.chapters.flatMap(ch => (ch.notes || []).map(n => ({...n, chapter: ch.title}))).slice(0, 6).map(note => `
              <div class="note-card">
                <div class="note-tag">${note.tag} · ${escapeHtml(note.chapter)}</div>
                <p>${escapeHtml(note.text)}</p>
                <div class="note-date">${note.date}</div>
              </div>
            `).join('') || '<p style="color:var(--text-muted);font-size:13px;">No notes yet. Add notes to chapters to see them here.</p>'}
          </div>
        </div>
      </div>
    </div>
  `;
}

// ─── STATS & META ───
function updateStats() {
  const totalWords = bookData.chapters.reduce((sum, ch) => sum + ch.wordCount + ch.subchapters.reduce((s, sub) => s + sub.wordCount, 0), 0);
  const totalCh = bookData.chapters.length;
  const totalSubs = bookData.chapters.reduce((sum, ch) => sum + ch.subchapters.length, 0);
  const finalCount = bookData.chapters.filter(ch => ch.status === 'final').length + bookData.chapters.reduce((sum, ch) => sum + ch.subchapters.filter(s => s.status === 'final').length, 0);
  const totalItems = totalCh + totalSubs;
  const completion = totalItems > 0 ? Math.round((finalCount / totalItems) * 100) : 0;

  document.getElementById('statTotalWords').textContent = totalWords.toLocaleString();
  document.getElementById('statChapters').textContent = totalCh;
  document.getElementById('statSections').textContent = totalSubs;
  document.getElementById('statCompletion').textContent = completion + '%';
  document.getElementById('progressFill').style.width = completion + '%';

  // Update outline
  const outline = document.getElementById('outlineList');
  outline.innerHTML = bookData.chapters.map(ch => `
    <li onclick="selectChapter('${ch.id}')">Ch.${ch.number} ${escapeHtml(ch.title)}</li>
    ${ch.subchapters.map(sub => `
      <li style="padding-left:16px;" onclick="selectSubchapter('${ch.id}', '${sub.id}')">${sub.number} ${escapeHtml(sub.title)}</li>
    `).join('')}
  `).join('');
}

function updateBookMeta() {
  const totalWords = bookData.chapters.reduce((sum, ch) => sum + ch.wordCount + ch.subchapters.reduce((s, sub) => s + sub.wordCount, 0), 0);
  document.getElementById('total-chapters').textContent = bookData.chapters.length + ' chapters';
  document.getElementById('total-words').textContent = totalWords.toLocaleString() + ' words';
  document.getElementById('last-edited').textContent = 'Last edited: ' + new Date().toLocaleDateString();
}

// ─── BREADCRUMBS ───
function updateBreadcrumbs() {
  const bc = document.getElementById('breadcrumbs');
  if (!currentChapterId) {
    bc.innerHTML = '<span class="crumb" onclick="showDashboard()">Manuscript</span>';
    return;
  }

  const ch = bookData.chapters.find(c => c.id === currentChapterId);
  let html = `<span class="crumb" onclick="showDashboard()">Manuscript</span><span class="sep">/</span>`;
  html += `<span class="crumb" onclick="selectChapter('${ch.id}')">Ch.${ch.number}</span>`;

  if (currentSubchapterId) {
    const sub = ch.subchapters.find(s => s.id === currentSubchapterId);
    html += `<span class="sep">/</span><span class="crumb">${sub.number}</span>`;
  }

  bc.innerHTML = html;
}

// ─── MODAL ───
function openModal(type) {
  modalType = type;
  const overlay = document.getElementById('modalOverlay');
  const title = document.getElementById('modalTitle');
  const parentGroup = document.getElementById('parentSelectGroup');
  const parentSelect = document.getElementById('modalParentSelect');

  document.getElementById('modalTitleInput').value = '';
  document.getElementById('modalNotes').value = '';

  if (type === 'chapter') {
    title.textContent = 'Add New Chapter';
    parentGroup.style.display = 'none';
  } else {
    title.textContent = 'Add New Section';
    parentGroup.style.display = 'block';
    parentSelect.innerHTML = bookData.chapters.map(ch => 
      `<option value="${ch.id}">Ch.${ch.number} ${ch.title}</option>`
    ).join('');
  }

  overlay.classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function saveModal() {
  const title = document.getElementById('modalTitleInput').value.trim();
  const status = document.getElementById('modalStatus').value;
  const notes = document.getElementById('modalNotes').value.trim();

  if (!title) return;

  if (modalType === 'chapter') {
    const newNum = bookData.chapters.length + 1;
    const newCh = {
      id: 'ch-' + Date.now(),
      number: newNum,
      title: title,
      status: status,
      wordCount: 0,
      content: '',
      notes: notes ? [{ tag: 'note', text: notes, date: new Date().toISOString().split('T')[0] }] : [],
      subchapters: []
    };
    bookData.chapters.push(newCh);
    selectChapter(newCh.id);
  } else {
    const parentId = document.getElementById('modalParentSelect').value;
    const ch = bookData.chapters.find(c => c.id === parentId);
    const newSubNum = `${ch.number}.${ch.subchapters.length + 1}`;
    const newSub = {
      id: 'sub-' + Date.now(),
      number: newSubNum,
      title: title,
      status: status,
      wordCount: 0,
      content: '',
      notes: notes ? [{ tag: 'note', text: notes, date: new Date().toISOString().split('T')[0] }] : []
    };
    ch.subchapters.push(newSub);
    selectSubchapter(parentId, newSub.id);
  }

  renderTOC();
  updateStats();
  closeModal();
}

// ─── STATUS & DELETE ───
function updateStatus(type, id, newStatus) {
  if (type === 'ch') {
    const ch = bookData.chapters.find(c => c.id === id);
    if (ch) ch.status = newStatus;
  } else {
    bookData.chapters.forEach(ch => {
      const sub = ch.subchapters.find(s => s.id === id);
      if (sub) sub.status = newStatus;
    });
  }
  renderTOC();
  renderEditor();
  updateStats();
}

function deleteItem(type, id) {
  if (!confirm('Are you sure? This cannot be undone.')) return;

  if (type === 'ch') {
    bookData.chapters = bookData.chapters.filter(c => c.id !== id);
    // Renumber
    bookData.chapters.forEach((ch, i) => {
      ch.number = i + 1;
      ch.subchapters.forEach((sub, j) => {
        sub.number = `${ch.number}.${j + 1}`;
      });
    });
    showDashboard();
  } else {
    bookData.chapters.forEach(ch => {
      ch.subchapters = ch.subchapters.filter(s => s.id !== id);
      // Renumber subs
      ch.subchapters.forEach((sub, i) => {
        sub.number = `${ch.number}.${i + 1}`;
      });
    });
    selectChapter(currentChapterId);
  }

  renderTOC();
  updateStats();
}

// ─── SEARCH ───
function filterTOC(query) {
  const q = query.toLowerCase();
  const chapters = document.querySelectorAll('.chapter');

  chapters.forEach(chEl => {
    const chId = chEl.dataset.id;
    const ch = bookData.chapters.find(c => c.id === chId);
    const chMatch = ch.title.toLowerCase().includes(q);
    const subMatch = ch.subchapters.some(s => s.title.toLowerCase().includes(q));

    if (chMatch || subMatch || !q) {
      chEl.style.display = 'block';
      if (subMatch && q) {
        const subs = chEl.querySelector('.subchapters');
        const toggle = chEl.querySelector('.ch-toggle');
        if (subs) subs.classList.add('open');
        if (toggle) toggle.classList.add('expanded');
      }
    } else {
      chEl.style.display = 'none';
    }
  });
}

// ─── EXPORT / IMPORT ───
function exportData() {
  const dataStr = JSON.stringify(bookData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'manuscript.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.chapters) {
        bookData = data;
        renderTOC();
        updateStats();
        showDashboard();
        alert('Manuscript loaded successfully!');
      }
    } catch (err) {
      alert('Invalid JSON file');
    }
  };
  reader.readAsText(file);
}

// ─── TITLE EDITING ───
function editTitle() {
  const titleEl = document.getElementById('editableTitle');
  if (!titleEl || titleEl.querySelector('input')) return;

  const currentText = titleEl.textContent;
  titleEl.innerHTML = `<input type="text" id="titleEditInput" value="${escapeHtml(currentText)}" 
    style="font:inherit;font-weight:700;color:var(--text-primary);background:var(--bg);border:1px solid var(--accent);border-radius:var(--radius);padding:4px 8px;outline:none;width:100%;max-width:500px;"
    onblur="saveTitle()" onkeydown="if(event.key==='Enter'){event.preventDefault();saveTitle();}">`;

  const input = document.getElementById('titleEditInput');
  input.focus();
  input.select();
}

function saveTitle() {
  const input = document.getElementById('titleEditInput');
  if (!input) return;

  const newTitle = input.value.trim();
  if (!newTitle) {
    // Revert to original if empty
    renderEditor();
    return;
  }

  // Find the target and update it
  const ch = bookData.chapters.find(c => c.id === currentChapterId);
  if (!ch) return;

  if (currentSubchapterId) {
    const sub = ch.subchapters.find(s => s.id === currentSubchapterId);
    if (sub) sub.title = newTitle;
  } else {
    ch.title = newTitle;
  }

  renderTOC();
  updateBreadcrumbs();
  renderEditor();
  updateStats();
}

// ─── UTILS ───
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
</script>
</body>
</html>
