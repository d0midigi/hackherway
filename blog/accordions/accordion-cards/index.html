<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Accordion Cards</title>

  </head>
    
  <body>
  <!-- Latest compiled and minified CSS -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

<div class="cardBox">

<div class="accordionCard">
<button class="accordion">
  <h4>Vaccine Record Upload Validations</h4>
</button>
<div class="accordionPanel">
    <button class="expandedAccordionButton" onclick="window.location.href='https://www.google.com'">Unreviewed</button>
    <button class="expandedAccordionButton">Invalidated</button>
    <button class="expandedAccordionButton">Notified</button>
    <button class="expandedAccordionButton">Validated</button>
</div>
</div>    
 
  <div class="accordionCard">
<button class="accordion">
  <h4>Medical & Religious Vaccine Exemptions</h4>
</button>
<div class="accordionPanel">
    <button class="expandedAccordionButton">Submitted</button>
    <button class="expandedAccordionButton">Invalidated</button>
    <button class="expandedAccordionButton">Notified</button>
    <button class="expandedAccordionButton">Validated</button>
</div>
</div>
  
  <div class="accordionCard">
<button class="accordion">
  <h4>Remote Student & Employee Vaccine Exemptions</h4>
</button>
<div class="accordionPanel">
    <button class="expandedAccordionButton">Submitted</button>
    <button class="expandedAccordionButton">Invalidated</button>
    <button class="expandedAccordionButton">Notified</button>
    <button class="expandedAccordionButton">Validated</button>
</div>
</div>
  
    <div class="accordionCard">
<button class="accordion">
  <h4>COVID Test Results</h4>
  <br>
</button>
<div class="accordionPanel">
    <button class="expandedAccordionButton">Submitted</button>
    <button class="expandedAccordionButton">Invalidated</button>
    <button class="expandedAccordionButton">Notified</button>
    <button class="expandedAccordionButton">Validated</button>
</div>
</div>
  
  
</div>
