<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Architect — Master of Your Domain</title>
<style>
  :root {
    --bg: #0a0a0a;
    --bg-elev: #111111;
    --bg-hover: #1a1a1a;
    --border: #2a2a2a;
    --text: #c0c0c0;
    --text-dim: #777;
    --text-faint: #555;
    --accent: #fe0942;
    --accent-dim: #b0062e;
    --green: #0f0;
    --yellow: #ffcc00;
    --font: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  .top-bar {
    background: var(--bg-elev);
    border-bottom: 2px solid var(--accent);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .top-bar h1 {
    color: var(--accent);
    font-size: 16px;
    letter-spacing: 1px;
  }
  .top-bar .meta {
    color: var(--text-faint);
    font-size: 11px;
    margin-left: auto;
    display: flex;
    gap: 20px;
  }
  .top-bar button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 14px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .top-bar button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .top-bar input[type="file"] { display: none; }
  /* Layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  /* Left sidebar — TOC */
  .sidebar {
    width: 320px;
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .search-box {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .toc-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .toc-node {
    padding: 6px 12px 6px 12px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-left: 2px solid transparent;
  }
  .toc-node:hover {
    background: var(--bg-hover);
  }
  .toc-node.active {
    background: var(--bg-hover);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .toc-node .toggle {
    width: 14px;
    text-align: center;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 10px;
  }
  .toc-node .toggle:hover { color: var(--accent); }
  .toc-node .icon { font-size: 11px; }
  .toc-node .title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toc-node .wc {
    color: var(--text-faint);
    font-size: 10px;
  }
  .toc-node .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-draft { background: var(--text-faint); }
  .status-locked { background: var(--yellow); }
  .status-in-progress { background: var(--accent); }
  .status-reviewed { background: var(--green); }
  .indent-1 { padding-left: 24px; }
  .indent-2 { padding-left: 40px; }
  .indent-3 { padding-left: 56px; }
  .indent-4 { padding-left: 72px; }
  .toc-actions {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .toc-actions button {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
  }
  .toc-actions button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  /* Center — Dashboard / Editor */
  .center {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .dashboard {
    max-width: 900px;
  }
  .dashboard h2 {
    color: var(--accent);
    font-size: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 14px;
  }
  .stat-card .label {
    color: var(--text-faint);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .stat-card .value {
    color: var(--accent);
    font-size: 22px;
    font-weight: bold;
  }
  .recent-list {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 12px;
  }
  .recent-list h3 {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .recent-item {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    cursor: pointer;
  }
  .recent-item:hover { color: var(--accent); }
  .recent-item:last-child { border-bottom: none; }
  /* Editor */
  .editor { max-width: 900px; }
  .editor-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .editor-header h2 {
    color: var(--accent);
    font-size: 18px;
  }
  .editor-header .part-tag {
    color: var(--text-faint);
    font-size: 11px;
    border: 1px solid var(--border);
    padding: 2px 8px;
  }
  .field-group {
    margin-bottom: 16px;
  }
  .field-group label {
    display: block;
    color: var(--text-faint);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .field-group input[type="text"],
  .field-group textarea,
  .field-group select {
    width: 100%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
  }
  .field-group input:focus,
  .field-group textarea:focus,
  .field-group select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-group textarea {
    min-height: 120px;
    resize: vertical;
  }
  .field-group .word-count {
    text-align: right;
    color: var(--text-faint);
    font-size: 10px;
    margin-top: 4px;
  }
  .status-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }
  .tag-input {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 8px;
    min-height: 40px;
  }
  .tag-input .tag {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tag-input .tag .remove {
    cursor: pointer;
    font-weight: bold;
  }
  .tag-input .tag .remove:hover { color: #000; }
  .tag-input input {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    flex: 1;
    min-width: 80px;
  }
  .tag-input input:focus { outline: none; }
  .subchapter-list {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    padding: 10px;
  }
  .sub-item {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .sub-item:hover { color: var(--accent); }
  .sub-item:last-child { border-bottom: none; }
  .sub-item .del {
    color: var(--text-faint);
    cursor: pointer;
    font-size: 10px;
  }
  .sub-item .del:hover { color: var(--accent); }
  .btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-dim); }
  .hidden { display: none !important; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
<base target="_blank">
</head>
<body>

<div class="top-bar">
  <h1>📐 BOOK ARCHITECT</h1>
  <div class="meta">
    <span id="bookTitle">Master of Your Domain</span>
    <span id="lastEdited">Never edited</span>
    <span id="totalWords">0 words</span>
  </div>
  <button onclick="showDashboard()">Dashboard</button>
  <button onclick="exportJSON()">Export JSON</button>
  <button onclick="document.getElementById('importFile').click()">Import JSON</button>
  <input type="file" id="importFile" accept=".json" onchange="importJSON(this)">
  <button onclick="clearStorage()" style="color:var(--accent)">Reset</button>
</div>

<div class="main">
  <!-- LEFT: TOC -->
  <div class="sidebar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search titles, content, notes..." oninput="doSearch()">
    </div>
    <div class="toc-scroll" id="tocScroll"></div>
    <div class="toc-actions">
      <button onclick="addNode('chapter')">+ Chapter</button>
      <button onclick="addNode('part')">+ Part</button>
    </div>
  </div>

  <!-- CENTER: Content -->
  <div class="center" id="centerArea">
    <!-- Dashboard view -->
    <div class="dashboard" id="dashboardView">
      <h2>Manuscript Dashboard</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="recent-list">
        <h3>Recently Edited</h3>
        <div id="recentList"></div>
      </div>
    </div>
    <!-- Editor view -->
    <div class="editor hidden" id="editorView">
      <div class="editor-header">
        <h2 id="editorTitle">Chapter Title</h2>
        <span class="part-tag" id="editorPart"></span>
        <span style="margin-left:auto;color:var(--text-faint);font-size:11px;" id="editorId"></span>
      </div>

      <div class="status-row">
        <div class="field-group">
          <label>Structure Status</label>
          <select id="edStructureStatus" onchange="saveEditorField('structureStatus', this.value)">
            <option>outline</option>
            <option>locked</option>
            <option>restructure-needed</option>
          </select>
        </div>
        <div class="field-group">
          <label>Prose Status</label>
          <select id="edProseStatus" onchange="saveEditorField('proseStatus', this.value)">
            <option>not-started</option>
            <option>in-progress</option>
            <option>first-draft</option>
            <option>revised</option>
            <option>final</option>
          </select>
        </div>
        <div class="field-group">
          <label>Technical Review</label>
          <select id="edTechnicalStatus" onchange="saveEditorField('technicalStatus', this.value)">
            <option>not-reviewed</option>
            <option>pending</option>
            <option>passed</option>
            <option>needs-revision</option>
          </select>
        </div>
        <div class="field-group">
          <label>Editorial Review</label>
          <select id="edEditorialStatus" onchange="saveEditorField('editorialStatus', this.value)">
            <option>not-reviewed</option>
            <option>pending</option>
            <option>passed</option>
            <option>needs-revision</option>
          </select>
        </div>
      </div>

      <div class="field-group">
        <label>Thesis / Core Argument</label>
        <textarea id="edThesis" oninput="saveEditorField('thesis', this.value)"></textarea>
      </div>
      <div class="field-group">
        <label>Purpose / Learning Objectives</label>
        <textarea id="edPurpose" oninput="saveEditorField('purpose', this.value)"></textarea>
      </div>
      <div class="field-group">
        <label>Content</label>
        <textarea id="edContent" oninput="saveContent(this.value)"></textarea>
        <div class="word-count" id="edWordCount">0 words</div>
      </div>

      <div class="field-group">
        <label>Tags</label>
        <div class="tag-input" id="tagContainer" onclick="document.getElementById('tagInput').focus()">
          <input type="text" id="tagInput" placeholder="Add tag..." onkeydown="handleTagKey(event)">
        </div>
      </div>

      <div class="field-group">
        <label>Notes</label>
        <textarea id="edNotes" oninput="saveEditorField('notes', this.value)" placeholder="Research notes, reminders, sources..."></textarea>
      </div>
      <div class="field-group">
        <label>Open Questions</label>
        <textarea id="edOpenQuestions" oninput="saveEditorField('openQuestions', this.value)" placeholder="What still needs to be answered?"></textarea>
      </div>
      <div class="field-group">
        <label>Dependencies</label>
        <textarea id="edDependencies" oninput="saveEditorField('dependencies', this.value)" placeholder="Chapters or sections this relies on..."></textarea>
      </div>
      <div class="field-group">
        <label>Figures / Tables / Exercises / References</label>
        <textarea id="edExtras" oninput="saveEditorField('extras', this.value)" placeholder="List figures, tables, exercises, citations..."></textarea>
      </div>

      <div class="field-group">
        <label>Subsections</label>
        <div class="subchapter-list" id="subList"></div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <input type="text" id="newSubTitle" placeholder="New section title..." style="flex:1;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);padding:8px;font-family:inherit;font-size:12px;">
          <button class="btn" onclick="addSubsection()">+ Add Section</button>
        </div>
      </div>

      <div style="margin-top:20px;display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="showDashboard()">← Back to Dashboard</button>
        <button class="btn" onclick="deleteCurrentNode()" style="color:var(--accent)">Delete Node</button>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const STORAGE_KEY = "master-of-your-domain-book";

// ============================================
// DEFAULT DATA — 44-chapter skeleton
// ============================================
function makeDefaultBook() {
  const parts = [
    "Part I — Foundations and Terrain",
    "Part II — Offensive Operations",
    "Part III — Defensive Architecture",
    "Part IV — Mission Assurance and Recovery"
  ];
  const chapters = [
    // Part I
    { n: 1, t: "The Identity Imperative", part: 0 },
    { n: 2, t: "The Architecture of Authority", part: 0 },
    { n: 3, t: "Directory Services Deep Dive", part: 0 },
    { n: 4, t: "Certificate Services and Trust", part: 0 },
    { n: 5, t: "Federation and Cloud Identity", part: 0 },
    { n: 6, t: "The Federal Identity Lifecycle", part: 0 },
    { n: 7, t: "Threat Modeling Identity Infrastructure", part: 0 },
    { n: 8, t: "The Attacker's Perspective", part: 0 },
    { n: 9, t: "Reconnaissance and Enumeration", part: 0 },
    { n: 10, t: "Credential Harvesting Fundamentals", part: 0 },
    { n: 11, t: "Kerberos: Protocol and Weakness", part: 0 },
    // Part II
    { n: 12, t: "Initial Access Vectors", part: 1 },
    { n: 13, t: "Privilege Escalation: Local to Domain", part: 1 },
    { n: 14, t: "Lateral Movement Techniques", part: 1 },
    { n: 15, t: "Persistence Mechanisms", part: 1 },
    { n: 16, t: "Credential Dumping and Replay", part: 1 },
    { n: 17, t: "Kerberoasting and AS-REP Roasting", part: 1 },
    { n: 18, t: "Delegation Abuse", part: 1 },
    { n: 19, t: "ACL Exploitation", part: 1 },
    { n: 20, t: "Trust Abuse and Cross-Forest Attacks", part: 1 },
    { n: 21, t: "AD CS Attack Paths", part: 1 },
    { n: 22, t: "Cloud Identity Compromise", part: 1 },
    // Part III
    { n: 23, t: "Hardening the Directory", part: 2 },
    { n: 24, t: "Privileged Access Workstations", part: 2 },
    { n: 25, t: "Tiered Administration Model", part: 2 },
    { n: 26, t: "Group Policy Security", part: 2 },
    { n: 27, t: "Certificate Authority Hardening", part: 2 },
    { n: 28, t: "Kerberos Hardening", part: 2 },
    { n: 29, t: "Network Segmentation for AD", part: 2 },
    { n: 30, t: "Defensive Monitoring and Logging", part: 2 },
    { n: 31, t: "Threat Hunting in AD", part: 2 },
    { n: 32, t: "Deception and Honeypots", part: 2 },
    { n: 33, t: "Cloud Identity Defense", part: 2 },
    // Part IV
    { n: 34, t: "Incident Response for Identity", part: 3 },
    { n: 35, t: "Forensic Artifact Collection", part: 3 },
    { n: 36, t: "Timeline Reconstruction", part: 3 },
    { n: 37, t: "Malicious GPO Cleanup", part: 3 },
    { n: 38, t: "Persistence Eradication", part: 3 },
    { n: 39, t: "Service Account Rotation", part: 3 },
    { n: 40, t: "Forest Recovery Procedures", part: 3 },
    { n: 41, t: "Business Continuity Planning", part: 3 },
    { n: 42, t: "RMF and Compliance Alignment", part: 3 },
    { n: 43, t: "Purple Team Exercises", part: 3 },
    { n: 44, t: "The Future of Identity Security", part: 3 }
  ];

  return {
    title: "Master of Your Domain",
    subtitle: "A Comprehensive Guide to Active Directory Attack, Defense, and Mission Assurance",
    author: "",
    lastEdited: new Date().toISOString(),
    chapters: chapters.map((c, i) => ({
      id: "ch-" + c.n,
      number: c.n,
      part: parts[c.part],
      title: c.t,
      status: "draft",
      structureStatus: "outline",
      proseStatus: "not-started",
      technicalStatus: "not-reviewed",
      editorialStatus: "not-reviewed",
      thesis: "",
      purpose: "",
      content: "",
      notes: "",
      openQuestions: "",
      dependencies: "",
      extras: "",
      tags: [],
      subchapters: [],
      wordCount: 0
    }))
  };
}

// ============================================
// STATE
// ============================================
let bookData = makeDefaultBook();
let currentNodeId = null;
let expanded = new Set(["root"]);
let searchQuery = "";

// ============================================
// PERSISTENCE
// ============================================
function saveToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bookData));
}

function loadFromStorage() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      bookData = JSON.parse(saved);
    } catch (e) {
      console.error("Failed to load:", e);
    }
  }
}

function clearStorage() {
  if (confirm("Wipe all saved manuscript data?")) {
    localStorage.removeItem(STORAGE_KEY);
    bookData = makeDefaultBook();
    currentNodeId = null;
    showDashboard();
    renderTOC();
    updateStats();
  }
}

// ============================================
// UTILITIES
// ============================================
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function countWords(text) {
  return text && text.trim() ? text.trim().split(/\s+/).length : 0;
}

function getNodeWordCount(node) {
  if (node.subchapters && node.subchapters.length > 0) {
    return node.subchapters.reduce((sum, sub) => sum + getNodeWordCount(sub), 0);
  }
  return node.wordCount || countWords(node.content);
}

function getTotalWordCount() {
  return bookData.chapters.reduce((sum, ch) => sum + getNodeWordCount(ch), 0);
}

function touchBook() {
  bookData.lastEdited = new Date().toISOString();
  saveToStorage();
  updateBookMeta();
}

function findNode(id, list) {
  if (!list) list = bookData.chapters;
  for (const node of list) {
    if (node.id === id) return node;
    if (node.subchapters) {
      const found = findNode(id, node.subchapters);
      if (found) return found;
    }
  }
  return null;
}

function findParent(id, list, parent) {
  if (!list) list = bookData.chapters;
  for (const node of list) {
    if (node.id === id) return parent || null;
    if (node.subchapters) {
      const found = findParent(id, node.subchapters, node);
      if (found) return found;
    }
  }
  return null;
}

function generateId() {
  return "node-" + Math.random().toString(36).substr(2, 9);
}

function formatDate(iso) {
  if (!iso) return "Never";
  const d = new Date(iso);
  return d.toLocaleString();
}

// ============================================
// RENDER TOC
// ============================================
function renderTOC() {
  const container = document.getElementById("tocScroll");
  container.innerHTML = "";

  function renderNode(node, depth) {
    const hasKids = node.subchapters && node.subchapters.length > 0;
    const isExpanded = expanded.has(node.id);
    const isActive = node.id === currentNodeId;
    const indentClass = "indent-" + Math.min(depth, 4);
    const wc = getNodeWordCount(node);

    const div = document.createElement("div");
    div.className = "toc-node " + indentClass + (isActive ? " active" : "");

    // Status dot color
    let dotClass = "status-draft";
    if (node.proseStatus === "final") dotClass = "status-reviewed";
    else if (node.proseStatus === "in-progress" || node.proseStatus === "first-draft" || node.proseStatus === "revised") dotClass = "status-in-progress";
    else if (node.structureStatus === "locked") dotClass = "status-locked";

    const toggle = hasKids ? `<span class="toggle" onclick="event.stopPropagation();toggleExpand('${node.id}')">${isExpanded ? "▼" : "▶"}</span>` : `<span class="toggle"></span>`;
    const icon = hasKids ? "📁" : "📄";
    const num = node.number ? `Ch.${node.number} ` : "";

    div.innerHTML = `
      ${toggle}
      <span class="icon">${icon}</span>
      <span class="title">${escapeHtml(num + node.title)}</span>
      <span class="status-dot ${dotClass}"></span>
      <span class="wc">${wc > 0 ? wc.toLocaleString() : ""}</span>
    `;
    div.onclick = () => openNode(node.id);
    container.appendChild(div);

    if (hasKids && isExpanded) {
      node.subchapters.forEach(child => renderNode(child, depth + 1));
    }
  }

  // Filtered render for search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    function matches(node) {
      const inTitle = (node.title || "").toLowerCase().includes(q);
      const inContent = (node.content || "").toLowerCase().includes(q);
      const inNotes = (node.notes || "").toLowerCase().includes(q);
      const inThesis = (node.thesis || "").toLowerCase().includes(q);
      if (inTitle || inContent || inNotes || inThesis) return true;
      if (node.subchapters) return node.subchapters.some(matches);
      return false;
    }
    bookData.chapters.forEach(ch => {
      if (matches(ch)) renderNode(ch, 0);
    });
  } else {
    bookData.chapters.forEach(ch => renderNode(ch, 0));
  }
}

function toggleExpand(id) {
  if (expanded.has(id)) expanded.delete(id);
  else expanded.add(id);
  renderTOC();
}

// ============================================
// EDITOR
// ============================================
function openNode(id) {
  currentNodeId = id;
  const node = findNode(id);
  if (!node) return;

  document.getElementById("dashboardView").classList.add("hidden");
  document.getElementById("editorView").classList.remove("hidden");

  document.getElementById("editorTitle").textContent = node.title || "Untitled";
  document.getElementById("editorPart").textContent = node.part || "";
  document.getElementById("editorId").textContent = node.id;

  document.getElementById("edStructureStatus").value = node.structureStatus || "outline";
  document.getElementById("edProseStatus").value = node.proseStatus || "not-started";
  document.getElementById("edTechnicalStatus").value = node.technicalStatus || "not-reviewed";
  document.getElementById("edEditorialStatus").value = node.editorialStatus || "not-reviewed";

  document.getElementById("edThesis").value = node.thesis || "";
  document.getElementById("edPurpose").value = node.purpose || "";
  document.getElementById("edContent").value = node.content || "";
  document.getElementById("edNotes").value = node.notes || "";
  document.getElementById("edOpenQuestions").value = node.openQuestions || "";
  document.getElementById("edDependencies").value = node.dependencies || "";
  document.getElementById("edExtras").value = node.extras || "";

  const wc = getNodeWordCount(node);
  document.getElementById("edWordCount").textContent = wc.toLocaleString() + " words";

  renderTags(node);
  renderSubchapters(node);
  renderTOC();
}

function saveEditorField(field, value) {
  if (!currentNodeId) return;
  const node = findNode(currentNodeId);
  if (!node) return;
  node[field] = value;
  touchBook();
  if (field === "title" || field === "part") {
    document.getElementById("editorTitle").textContent = node.title;
    document.getElementById("editorPart").textContent = node.part || "";
  }
  renderTOC();
  updateStats();
}

function saveContent(value) {
  if (!currentNodeId) return;
  const node = findNode(currentNodeId);
  if (!node) return;
  node.content = value;
  node.wordCount = countWords(value);
  document.getElementById("edWordCount").textContent = getNodeWordCount(node).toLocaleString() + " words";
  touchBook();
  renderTOC();
  updateStats();
}

function renderTags(node) {
  const container = document.getElementById("tagContainer");
  const tags = node.tags || [];
  let html = tags.map(t => `<span class="tag">${escapeHtml(t)} <span class="remove" onclick="removeTag('${escapeHtml(t)}')">×</span></span>`).join("");
  html += `<input type="text" id="tagInput" placeholder="Add tag..." onkeydown="handleTagKey(event)">`;
  container.innerHTML = html;
  document.getElementById("tagInput").focus();
}

function handleTagKey(e) {
  if (e.key === "Enter" || e.key === ",") {
    e.preventDefault();
    const input = document.getElementById("tagInput");
    const val = input.value.trim();
    if (val && currentNodeId) {
      const node = findNode(currentNodeId);
      if (!node.tags) node.tags = [];
      if (!node.tags.includes(val)) node.tags.push(val);
      renderTags(node);
      touchBook();
    }
  } else if (e.key === "Backspace" && !e.target.value) {
    if (currentNodeId) {
      const node = findNode(currentNodeId);
      if (node.tags && node.tags.length) {
        node.tags.pop();
        renderTags(node);
        touchBook();
      }
    }
  }
}

function removeTag(tag) {
  if (!currentNodeId) return;
  const node = findNode(currentNodeId);
  node.tags = (node.tags || []).filter(t => t !== tag);
  renderTags(node);
  touchBook();
}

function renderSubchapters(node) {
  const list = document.getElementById("subList");
  if (!node.subchapters || node.subchapters.length === 0) {
    list.innerHTML = `<div style="color:var(--text-faint);font-size:11px;padding:6px;">No subsections yet.</div>`;
    return;
  }
  list.innerHTML = node.subchapters.map((sub, i) => `
    <div class="sub-item" onclick="openNode('${sub.id}')">
      <span>${escapeHtml(sub.number || "")} ${escapeHtml(sub.title)} <span style="color:var(--text-faint)">(${getNodeWordCount(sub).toLocaleString()})</span></span>
      <span class="del" onclick="event.stopPropagation();deleteSubchapter('${sub.id}')">DELETE</span>
    </div>
  `).join("");
}

function addSubsection() {
  if (!currentNodeId) return;
  const parent = findNode(currentNodeId);
  const title = document.getElementById("newSubTitle").value.trim();
  if (!title) return;
  if (!parent.subchapters) parent.subchapters = [];

  const count = parent.subchapters.length + 1;
  const num = parent.number ? `${parent.number}.${count}` : `${count}`;

  parent.subchapters.push({
    id: generateId(),
    number: num,
    title: title,
    content: "",
    wordCount: 0,
    subchapters: [],
    tags: [],
    structureStatus: "outline",
    proseStatus: "not-started",
    technicalStatus: "not-reviewed",
    editorialStatus: "not-reviewed"
  });

  document.getElementById("newSubTitle").value = "";
  touchBook();
  renderSubchapters(parent);
  renderTOC();
  updateStats();
}

function deleteSubchapter(id) {
  if (!currentNodeId) return;
  const parent = findNode(currentNodeId);
  if (!parent.subchapters) return;
  parent.subchapters = parent.subchapters.filter(s => s.id !== id);
  touchBook();
  renderSubchapters(parent);
  renderTOC();
  updateStats();
}

function deleteCurrentNode() {
  if (!currentNodeId) return;
  const node = findNode(currentNodeId);
  if (!node) return;
  if (!confirm(`Delete "${node.title}"? This cannot be undone.`)) return;

  // Remove from parent
  const parent = findParent(currentNodeId);
  if (parent && parent.subchapters) {
    parent.subchapters = parent.subchapters.filter(n => n.id !== currentNodeId);
  } else {
    bookData.chapters = bookData.chapters.filter(n => n.id !== currentNodeId);
  }
  currentNodeId = null;
  touchBook();
  showDashboard();
  renderTOC();
  updateStats();
}

// ============================================
// DASHBOARD
// ============================================
function showDashboard() {
  currentNodeId = null;
  document.getElementById("editorView").classList.add("hidden");
  document.getElementById("dashboardView").classList.remove("hidden");
  renderTOC();
  updateStats();
}

function updateStats() {
  const total = getTotalWordCount();
  const chCount = bookData.chapters.length;
  const secCount = bookData.chapters.reduce((s, c) => s + (c.subchapters ? c.subchapters.length : 0), 0);

  const statuses = { "not-started": 0, "in-progress": 0, "first-draft": 0, "revised": 0, "final": 0 };
  function tally(node) {
    if (node.proseStatus) statuses[node.proseStatus] = (statuses[node.proseStatus] || 0) + 1;
    if (node.subchapters) node.subchapters.forEach(tally);
  }
  bookData.chapters.forEach(tally);

  const grid = document.getElementById("statsGrid");
  grid.innerHTML = `
    <div class="stat-card"><div class="label">Total Words</div><div class="value">${total.toLocaleString()}</div></div>
    <div class="stat-card"><div class="label">Chapters</div><div class="value">${chCount}</div></div>
    <div class="stat-card"><div class="label">Sections</div><div class="value">${secCount}</div></div>
    <div class="stat-card"><div class="label">In Progress</div><div class="value">${statuses["in-progress"] || 0}</div></div>
    <div class="stat-card"><div class="label">Final</div><div class="value">${statuses["final"] || 0}</div></div>
    <div class="stat-card"><div class="label">Not Started</div><div class="value">${statuses["not-started"] || 0}</div></div>
  `;

  // Recent edited
  const recent = [];
  function collect(node) {
    if (node.content || node.thesis || node.notes) recent.push(node);
    if (node.subchapters) node.subchapters.forEach(collect);
  }
  bookData.chapters.forEach(collect);
  recent.sort((a, b) => ((b.lastTouched || 0) > (a.lastTouched || 0) ? 1 : -1));

  const recentEl = document.getElementById("recentList");
  if (recent.length === 0) {
    recentEl.innerHTML = `<div style="color:var(--text-faint);font-size:11px;">No edits yet. Start writing.</div>`;
  } else {
    recentEl.innerHTML = recent.slice(0, 8).map(n => `
      <div class="recent-item" onclick="openNode('${n.id}')">
        ${escapeHtml(n.number ? `Ch.${n.number}` : "")} ${escapeHtml(n.title)} 
        <span style="color:var(--text-faint)">— ${getNodeWordCount(n).toLocaleString()} words</span>
      </div>
    `).join("");
  }
}

function updateBookMeta() {
  document.getElementById("bookTitle").textContent = bookData.title || "Untitled";
  document.getElementById("lastEdited").textContent = "Last: " + formatDate(bookData.lastEdited);
  document.getElementById("totalWords").textContent = getTotalWordCount().toLocaleString() + " words";
}

// ============================================
// ADD NODES
// ============================================
function addNode(type) {
  const title = prompt(type === "part" ? "Part title:" : "Chapter title:");
  if (!title) return;

  if (type === "part") {
    // Parts are just chapters with part label and no number
    bookData.chapters.push({
      id: generateId(),
      title: title,
      part: title,
      status: "draft",
      structureStatus: "outline",
      proseStatus: "not-started",
      technicalStatus: "not-reviewed",
      editorialStatus: "not-reviewed",
      content: "",
      wordCount: 0,
      subchapters: [],
      tags: []
    });
  } else {
    const nextNum = bookData.chapters.filter(c => c.number).length + 1;
    bookData.chapters.push({
      id: "ch-" + nextNum,
      number: nextNum,
      title: title,
      part: bookData.chapters.length > 0 ? (bookData.chapters[bookData.chapters.length - 1].part || "") : "",
      status: "draft",
      structureStatus: "outline",
      proseStatus: "not-started",
      technicalStatus: "not-reviewed",
      editorialStatus: "not-reviewed",
      content: "",
      wordCount: 0,
      subchapters: [],
      tags: []
    });
  }
  touchBook();
  renderTOC();
  updateStats();
}

// ============================================
// SEARCH
// ============================================
function doSearch() {
  searchQuery = document.getElementById("searchInput").value.trim();
  renderTOC();
}

// ============================================
// IMPORT / EXPORT
// ============================================
function exportJSON() {
  const blob = new Blob([JSON.stringify(bookData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "master-of-your-domain.json";
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.chapters) {
        bookData = data;
        touchBook();
        renderTOC();
        updateStats();
        showDashboard();
        alert("Imported successfully.");
      } else {
        alert("Invalid file format.");
      }
    } catch (err) {
      alert("Failed to parse JSON.");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

// ============================================
// INIT
// ============================================
document.addEventListener("DOMContentLoaded", () => {
  loadFromStorage();
  renderTOC();
  updateStats();
  updateBookMeta();
  showDashboard();
});
</script>
